[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theoc-agentgrid-protocol"
version = "0.2.0"
description = "Signed agent identity, handoffs, and receipts for AgentGrid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42,<51",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agrid = "agentgrid_protocol.cli:main"

[project.urls]
Homepage = "https://agentgrid-pied.vercel.app"
Documentation = "https://agentgrid-pied.vercel.app/docs"

[tool.setuptools]
packages = ["agentgrid_protocol"]
